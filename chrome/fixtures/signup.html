<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f2; color: #18181b; font: 15px/1.5 system-ui, -apple-system, sans-serif; }
    form { width: min(380px, 100% - 32px); display: grid; gap: 14px; padding: 32px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.06), 0 8px 24px rgb(0 0 0 / 0.06); }
    h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.02em; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
    input[type=email], input[type=password] { height: 40px; padding: 0 12px; border: 1px solid #d4d4d8; border-radius: 8px; font: inherit; }
    .consent { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 14px; line-height: 1.6; }
    .consent input { margin-top: 5px; }
    a { color: #047857; }
    button { height: 44px; border: 0; border-radius: 10px; background: #18181b; color: #fff; font: 600 15px system-ui, sans-serif; }
  </style>
</head>
<body>
  <form onsubmit="return false">
    <h1>Create your account</h1>
    <label>Email <input type="email" autocomplete="email" placeholder="you@example.com"></label>
    <label>Password <input type="password" autocomplete="new-password"></label>
    <label class="consent"><input type="checkbox"> <span>I agree to the <a href="spotify.html">Terms of Use</a> and have read the <a href="https://example.com/privacy">Privacy Policy</a>.</span></label>
    <button type="submit">Sign up</button>
  </form>
</body>
</html>
